services:
  coordinator:
    build:
      context: ./agents/coordinator
      dockerfile: Dockerfile
    container_name: deepguard_brain
    hostname: coordinator
    ports:
      - "8000:8000"
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-deepguard_redis_secret}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-deepguard_redis_secret}@redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GPT4_VISION_MODEL=${GPT4_VISION_MODEL:-gpt-4o}
      - ENABLE_GPT4_VISION=${ENABLE_GPT4_VISION:-true}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-deepguard_production_secure_jwt_secret_key_2025_minimum_64_bytes_required_for_sha256_hmac_algorithm_compliant}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-deepguard_secret}
      - MAIL_SERVER=${MAIL_SERVER:-smtp-relay.brevo.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_USE_TLS=${MAIL_USE_TLS:-true}
      - MAIL_FROM=${MAIL_FROM}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/deepguard-email}
      - N8N_OSINT_WEBHOOK_URL=${N8N_OSINT_WEBHOOK_URL:-http://n8n:5678/webhook/deepguard-osint}
      - REPORT_API_KEY=${REPORT_API_KEY:-deepguard_report_2025}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-deepguard123}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-patrick21.kugelman@gmail.com}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - GEMINI_VISION_MODEL=${GEMINI_VISION_MODEL:-gemini-2.0-flash}
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_BUCKET=deepfake-evidence
      - AWS_ACCESS_KEY_ID=any
      - AWS_SECRET_ACCESS_KEY=any
      - AWS_DEFAULT_REGION=us-east-1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - ENABLE_GEMINI_VISION=${ENABLE_GEMINI_VISION:-true}
      - ENABLE_VERTEX_AI=${ENABLE_VERTEX_AI:-false}
      - ENABLE_SYNTHID=${ENABLE_SYNTHID:-true}
      - EVIDENCE_DIR=/app/data/evidence
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8501}
      - DEMO_USERNAME=${DEMO_USERNAME:-Stefan}
      - DEMO_EMAIL=${DEMO_EMAIL:-patrick21.kugelman@gmail.com}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-deepguard123}
    volumes:
      - ./data:/app/data
      - ./agents/coordinator:/app/agents/coordinator
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    networks:
      - deepguard_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  vision_agent:
    build:
      context: ./agents/vision
      dockerfile: Dockerfile
    container_name: deepguard_vision
    ports:
      - "8002:8002"
    environment:
      - PYTHONUNBUFFERED=1
      - COORDINATOR_URL=http://deepguard_brain:8000
    volumes:
      - ./data:/app/data
      - ./agents/vision:/app
    depends_on:
      coordinator:
        condition: service_healthy
    networks:
      - deepguard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  audio_agent:
    build:
      context: ./agents/audio
      dockerfile: Dockerfile
    container_name: deepguard_audio
    ports:
      - "8004:8004"
    environment:
      - PYTHONUNBUFFERED=1
      - COORDINATOR_URL=http://deepguard_brain:8000
    volumes:
      - ./data:/app/data
      - ./agents/audio:/app
    depends_on:
      coordinator:
        condition: service_healthy
    networks:
      - deepguard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  video_agent:
    build:
      context: ./agents/video
      dockerfile: Dockerfile
    container_name: deepguard_video
    ports:
      - "8003:8003"
    environment:
      - PYTHONUNBUFFERED=1
      - COORDINATOR_URL=http://deepguard_brain:8000
      - TORCH_HOME=/app/torch_cache
      - VIDEO_FAKE_THRESHOLD=${VIDEO_FAKE_THRESHOLD:-40.0}
    volumes:
      - ./data:/app/data
      - ./agents/video:/app
      - ./models/torch_cache:/app/torch_cache
    depends_on:
      coordinator:
        condition: service_healthy
    networks:
      - deepguard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  text_agent:
    build:
      context: ./agents/text
      dockerfile: Dockerfile
    container_name: deepguard_text
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - COORDINATOR_URL=http://deepguard_brain:8000
    volumes:
      - ./data:/app/data
      - ./agents/text:/app
    depends_on:
      coordinator:
        condition: service_healthy
    networks:
      - deepguard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  bio_agent:
    build:
      context: ./agents/bio
      dockerfile: Dockerfile
    container_name: deepguard_bio
    ports:
      - "8005:8005"
    environment:
      - PYTHONUNBUFFERED=1
      - COORDINATOR_URL=http://deepguard_brain:8000
    volumes:
      - ./data:/app/data
      - ./agents/bio:/app
    depends_on:
      coordinator:
        condition: service_healthy
    networks:
      - deepguard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  fingerprint_agent:
    build:
      context: ./agents/fingerprint
      dockerfile: Dockerfile
    container_name: deepguard_fingerprint
    ports:
      - "8006:8006"
    environment:
      - PYTHONUNBUFFERED=1
      - COORDINATOR_URL=http://deepguard_brain:8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-deepguard_secret}
    volumes:
      - ./data:/app/data
      - ./agents/fingerprint:/app
    depends_on:
      coordinator:
        condition: service_healthy
    networks:
      - deepguard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  neo4j:
    image: neo4j:5.15
    container_name: deepguard_neo4j
    # Ports removed for security - accessible only within Docker network
    # Uncomment for debugging: ports: ["7474:7474", "7687:7687"]
    environment:
      - NEO4J_AUTH=neo4j/deepguard_secret
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    volumes:
      - ./data/neo4j:/data
    networks:
      - deepguard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-deepguard_secret} 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: deepguard_redis
    # Port removed for security - accessible only within Docker network
    # Uncomment for debugging: ports: ["6379:6379"]
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-deepguard_redis_secret}
    networks:
      - deepguard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-deepguard_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker:
    build:
      context: ./agents/coordinator
      dockerfile: Dockerfile
    container_name: deepguard_celery_worker
    command: celery -A celery_tasks worker --loglevel=info --pool=solo --concurrency=2

    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-deepguard_redis_secret}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-deepguard_redis_secret}@redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-deepguard_secret}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GPT4_VISION_MODEL=${GPT4_VISION_MODEL:-gpt-4o}
      - ENABLE_GPT4_VISION=${ENABLE_GPT4_VISION:-true}
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_BUCKET=deepfake-evidence
      - AWS_ACCESS_KEY_ID=any
      - AWS_SECRET_ACCESS_KEY=any
      - AWS_DEFAULT_REGION=us-east-1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - ENABLE_GEMINI_VISION=${ENABLE_GEMINI_VISION:-true}
      - GEMINI_VISION_MODEL=${GEMINI_VISION_MODEL:-gemini-2.0-flash}
      - GEMINI_INTER_FRAME_DELAY=${GEMINI_INTER_FRAME_DELAY:-1.5}
      - FRAMES_PER_SECOND=2
      - MAX_FRAMES_TO_ANALYZE=10
      - SAVE_ANNOTATED_FRAMES=true
      - EVIDENCE_DIR=/app/data/evidence
      - MAIL_SERVER=${MAIL_SERVER:-smtp-relay.brevo.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_USE_TLS=${MAIL_USE_TLS:-true}
      - MAIL_FROM=${MAIL_FROM}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/deepguard-email}
      - N8N_OSINT_WEBHOOK_URL=${N8N_OSINT_WEBHOOK_URL:-http://n8n:5678/webhook/deepguard-osint}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8501}
      - REPORT_API_KEY=${REPORT_API_KEY:-deepguard_report_2025}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./data:/app/data
      - ./agents/coordinator:/app/agents/coordinator
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      fingerprint_agent:
        condition: service_healthy
    networks:
      - deepguard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*worker' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  celery_beat:
    build:
      context: ./agents/coordinator
      dockerfile: Dockerfile
    container_name: deepguard_celery_beat
    command: celery -A celery_tasks beat --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-deepguard_redis_secret}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-deepguard_redis_secret}@redis:6379/0
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    volumes:
      - ./data:/app/data
      - ./agents/coordinator:/app/agents/coordinator
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - deepguard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  flower:
    build:
      context: ./agents/coordinator
      dockerfile: Dockerfile
    container_name: deepguard_flower
    command: celery -A celery_tasks flower --port=5555 --basic-auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-deepguard123}
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-deepguard_redis_secret}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-deepguard_redis_secret}@redis:6379/0
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    volumes:
      - ./agents/coordinator:/app/agents/coordinator
    working_dir: /app/agents/coordinator
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - deepguard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 5 http://localhost:5555/ -o /dev/null && echo ok || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: deepguard_s3
    ports:
      - "8333:8333"
      - "9333:9333"
    command: server -s3 -s3.port=8333 -dir=/data
    volumes:
      - ./seaweedfs:/data
    networks:
      - deepguard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8333/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deepguard_ui
    ports:
      - "8501:8501"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8000/ws}
    networks:
      - deepguard_net
    restart: unless-stopped
    depends_on:
      coordinator:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    container_name: deepguard_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-deepguard123}
      - N8N_LOG_LEVEL=warn
      - GENERIC_TIMEZONE=Europe/Bucharest
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - SIGHTENGINE_API_USER=${SIGHTENGINE_API_USER:-}
      - SIGHTENGINE_API_SECRET=${SIGHTENGINE_API_SECRET:-}
      - DEEPGUARD_REPORT_API_KEY=${REPORT_API_KEY:-deepguard_report_2025}
      - DEEPGUARD_CALLBACK_URL=http://coordinator:8000/osint/report
      - ADMIN_EMAIL=${ADMIN_EMAIL:-patrick21.kugelman@gmail.com}
    volumes:
      - ./n8n_data:/home/node/.n8n
    networks:
      - deepguard_net
    depends_on:
      coordinator:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dtrack-apiserver:
    image: dependencytrack/apiserver:latest
    container_name: deepguard_dtrack_api
    ports:
      - "8081:8080"
    environment:
      - EXTRA_JAVA_OPTIONS=-Xmx4g
      - ALPINE_DATABASE_MODE=internal
    volumes:
      - ./dependency-track:/data
    networks:
      - deepguard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  dtrack-frontend:
    image: dependencytrack/frontend:latest
    container_name: deepguard_dtrack_ui
    ports:
      - "8082:8080"
    environment:
      - API_BASE_URL=http://localhost:8081
    networks:
      - deepguard_net
    depends_on:
      dtrack-apiserver:
        condition: service_started
    restart: unless-stopped

networks:
  deepguard_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16