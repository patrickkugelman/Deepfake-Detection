# ============================================================================
# SigNoz Self-Hosted Observability Stack (v0.115+)
# Based on official SigNoz docker-compose setup
#
# Pornire:
#   docker compose -f docker-compose.signoz.yml up -d
#
# UI: http://localhost:3301
# ============================================================================

services:
  # ── ClickHouse (storage backend) ───────────────────────────────────────────
  signoz-clickhouse:
    image: clickhouse/clickhouse-server:25.6-alpine
    container_name: signoz_clickhouse
    hostname: clickhouse
    volumes:
      - signoz_clickhouse_data:/var/lib/clickhouse
      - ./signoz-config/clickhouse-config.xml:/etc/clickhouse-server/config.d/config.xml:ro
      - ./signoz-config/clickhouse-users.xml:/etc/clickhouse-server/users.d/users.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - deepguard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Schema Migrator (runs once to create ClickHouse tables) ────────────────
  signoz-schema-migrator:
    image: signoz/signoz-schema-migrator:latest
    container_name: signoz_schema_migrator
    command:
      - "sync"
      - "--dsn=tcp://clickhouse:9000"
      - "--dev"
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    networks:
      - deepguard_net
    restart: on-failure

  # ── SigNoz Server (unified: API + Frontend UI) ────────────────────────────
  signoz:
    image: signoz/signoz:latest
    container_name: signoz_server
    hostname: signoz
    volumes:
      - signoz_sqlite:/var/lib/signoz
    environment:
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_SQLSTORE_SQLITE_PATH=/var/lib/signoz/signoz.db
      - SIGNOZ_ALERTMANAGER_PROVIDER=signoz
      - SIGNOZ_TOKENIZER_JWT_SECRET=deepguard-signoz-jwt-secret-2025
      - GODEBUG=netdns=go
      - SIGNOZ_TELEMETRY_ENABLED=false
      - DEPLOYMENT_TYPE=docker-standalone-amd
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
      signoz-schema-migrator:
        condition: service_completed_successfully
    ports:
      - "3301:8080"
    networks:
      - deepguard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/v1/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── SigNoz OTEL Collector (receives traces from DeepGuard) ────────────────
  signoz-otelcol:
    image: signoz/signoz-otel-collector:latest
    container_name: signoz_otelcol
    hostname: signoz-otelcol
    command: ["--config=/etc/otelcol-config.yml"]
    volumes:
      - ./signoz-config/otelcol-config.yml:/etc/otelcol-config.yml:ro
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://clickhouse:9000
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
      signoz-schema-migrator:
        condition: service_completed_successfully
    networks:
      - deepguard_net
    restart: unless-stopped

volumes:
  signoz_clickhouse_data:
  signoz_sqlite:

networks:
  deepguard_net:
    external: true
    name: deepfake-detector-structure_deepguard_net
